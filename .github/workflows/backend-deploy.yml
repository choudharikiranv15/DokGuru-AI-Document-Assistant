name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

concurrency:
  group: backend-deploy
  cancel-in-progress: true

env:
  PROJECT_ID: project-ef045ea2-1f6e-46ec-9d7
  REGION: asia-south2
  SERVICE: dokguru-backend
  AR_REPO: dokguru-backend-repo

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          pip install pytest pytest-cov flake8

      - name: Lint with flake8
        run: |
          cd backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Run unit tests
        run: |
          cd backend
          if [ ! -d "tests" ]; then
            mkdir -p tests
            echo "def test_placeholder(): assert True" > tests/test_placeholder.py
          fi
          pytest tests/ -v --tb=short || true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SECRET_KEY: test-secret-ci

      - name: Test app imports
        run: |
          cd backend
          python -c "from app import app; print('✅ App imports successfully')"
        env:
          GROQ_API_KEY: test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_KEY: test
          SECRET_KEY: test

  deploy:
    name: Deploy to Cloud Run (Safe rollout + Auto rollback)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up QEMU & buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://${{ env.REGION }}-docker.pkg.dev

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # NEW: Capture current stable revision (before deploying)
      - name: Get previous stable revision
        run: |
          PREV=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format="value(status.traffic[0].revisionName)")
          echo "PREV_REVISION=$PREV" >> $GITHUB_ENV
          echo "Previous stable revision: $PREV"

      - name: Deploy new revision (no traffic yet)
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}

          gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE_TAG" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --platform managed \
            --allow-unauthenticated \
            --no-traffic \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --concurrency 10 \
            --port 8080 \
            --update-env-vars "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_KEY=${{ secrets.SUPABASE_KEY }},DATABASE_URL=${{ secrets.DATABASE_URL }},SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }},SECRET_KEY=${{ secrets.SECRET_KEY }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},GOOGLE_API_KEY=${{ secrets.GEMINI_API_KEY }},SAMBANOVA_API_KEY=${{ secrets.SAMBANOVA_API_KEY }},OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }},HUGGINGFACE_API_TOKEN=${{ secrets.HUGGINGFACE_API_TOKEN }},COHERE_API_KEY=${{ secrets.COHERE_API_KEY }},CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }},MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }},UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }},UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }},REDIS_URL=${{ secrets.REDIS_URL }},SENTRY_DSN=${{ secrets.SENTRY_DSN }},POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }},RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"

          REV=$(gcloud run revisions list \
            --service=${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --limit=1 \
            --sort-by=~metadata.creationTimestamp \
            --format='value(metadata.name)')

          echo "NEW_REVISION=$REV" >> $GITHUB_ENV

      - name: Shift 10% traffic to new revision
        run: |
          gcloud run services update-traffic ${{ env.SERVICE }} \
            --to-revisions $NEW_REVISION=10 \
            --region ${{ env.REGION }}

      - name: Get service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          echo "SERVICE_URL=$URL" >> $GITHUB_ENV

      # HEALTH CHECK + ROLLBACK
      - name: Health check 200 OK (or rollback)
        run: |
          MAX=8
          COUNT=0
          OK=false
          while [ $COUNT -lt $MAX ]; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health")
            if [ "$CODE" = "200" ]; then
              echo "Health OK"
              OK=true
              break
            fi
            COUNT=$((COUNT+1))
            sleep 8
          done

          if [ "$OK" = false ]; then
            echo "❌ Health failed — rolling back..."

            gcloud run services update-traffic ${{ env.SERVICE }} \
              --to-revisions $PREV_REVISION=100 \
              --region ${{ env.REGION }}

            echo "Rollback complete: $PREV_REVISION restored"
            exit 1
          fi

      - name: Promote to 100% traffic
        run: |
          gcloud run services update-traffic ${{ env.SERVICE }} \
            --to-revisions $NEW_REVISION=100 \
            --region ${{ env.REGION }}

      - name: Summary
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Service: ${{ env.SERVICE }}" >> $GITHUB_STEP_SUMMARY
          echo "- New Revision: $NEW_REVISION" >> $GITHUB_STEP_SUMMARY
          echo "- Previous Revision: $PREV_REVISION" >> $GITHUB_STEP_SUMMARY
          echo "- Region: ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ env.SERVICE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment successful" >> $GITHUB_STEP_SUMMARY